<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakker Games</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Start page -->
  <div id="start-screen" class="screen">
    <h1>Hey there!  Wanna play a game?</h1>
    <button id="start-btn">Start</button>
  </div>

  <!-- Game instructions -->
<div id="game-screen" class="screen hidden">
  <p class="instruction">Unscramble the word(s) to reveal a hidden message...</p>
  <div id="scramble-box"></div>
  <div id="answer-box"></div>
  <button id="submit-btn">Submit</button>
</div>


  <!-- Reveal Screen -->
  <div id="reveal-screen" class="screen hidden">
    <div id="heart-reveal"></div>
    <p id="message">Wait, you solved it!?  Wow, well... good job I guess.  It wasn't that hard anyway :)</p>
    <button id="play-again-btn">Do you wanna play again?</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
